name: Update billing

# Triggered by the agency dashboard when you record a payment, change the plan,
# or correct the balance. What is gated follows the balance unless the update
# explicitly overrides it.

on:
  workflow_dispatch:
    inputs:
      update:
        description: 'Billing update, e.g. {"balanceDue":0,"suspend":"false"}'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # Queue concurrent updates instead of racing them to the same branch.
    concurrency:
      group: billing-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Apply update
        id: bill
        # Passed through the environment rather than interpolated into the
        # script, so quotes in the payload cannot break out into the shell.
        env:
          UPDATE: ${{ github.event.inputs.update }}
        run: node .github/scripts/billing.cjs apply "$UPDATE"

      - name: Commit and push
        if: steps.bill.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.bill.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for f in billing.json site-status.js suspended.html snippets/subscription-gate.liquid; do
            if [ -e "$f" ]; then git add "$f"; fi
          done

          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi

          # An ad-hoc charge names itself, so the payment history reads as a
          # ledger rather than a row of identical "Update billing" lines.
          MESSAGE="${SUMMARY:-Update billing}"
          git commit -m "$MESSAGE"

          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected — rebasing and retrying ($attempt/3)"
            git pull --rebase
          done
          echo "Could not push after 3 attempts."
          exit 1

      - name: Summary
        run: |
          echo '### Billing' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat billing.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
