name: Monthly hosting accrual

# Adds each subscribed service to the outstanding balance on the 8th and gates
# what the client is paying for while anything is owed. Also runnable by hand
# from the Actions tab to test it without waiting for the schedule.
#
# Note: GitHub only runs scheduled workflows on the default branch, and may
# start them somewhat later than the stated time when the queue is busy.

on:
  schedule:
    - cron: '0 8 8 * *' # 08:00 UTC on the 8th = 09:00 Casablanca
  workflow_dispatch:

permissions:
  contents: write

jobs:
  accrue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Accrue what is due this month
        id: bill
        run: node .github/scripts/billing.cjs accrue

      - name: Commit and push
        if: steps.bill.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.bill.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only the files this system owns, and only where they exist —
          # a Shopify repo has no site-status.js, a Vercel one has no snippets.
          # Never `git add -A`: that would sweep up unrelated local work.
          for f in billing.json site-status.js suspended.html snippets/subscription-gate.liquid; do
            if [ -e "$f" ]; then git add "$f"; fi
          done

          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi

          git commit -m "${SUMMARY:-Accrue monthly subscription}"

          # Another run may have pushed between our checkout and now. Rebase
          # onto it and retry rather than dropping this change on the floor.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected — rebasing and retrying ($attempt/3)"
            git pull --rebase
          done
          echo "Could not push after 3 attempts."
          exit 1

      - name: Summary
        run: |
          echo '### Billing' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat billing.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
