name: Monthly hosting accrual

# Adds one month's hosting fee to the outstanding balance on the 8th and
# suspends the site while anything is owed. Also runnable by hand from the
# Actions tab to test it without waiting for the schedule.
#
# Note: GitHub only runs scheduled workflows on the default branch, and may
# start them somewhat later than the stated time when the queue is busy.

on:
  schedule:
    - cron: '0 8 8 * *' # 08:00 UTC on the 8th = 09:00 Casablanca
  workflow_dispatch:

permissions:
  contents: write

jobs:
  accrue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Accrue this month's fee
        id: bill
        run: node .github/scripts/billing.cjs accrue

      - name: Commit and push
        if: steps.bill.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add billing.json site-status.js
          git commit -m "Accrue monthly hosting fee"
          git push

      - name: Summary
        run: |
          echo '### Billing' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat billing.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
