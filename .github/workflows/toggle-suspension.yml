name: Toggle site suspension

on:
  workflow_dispatch:
    inputs:
      status:
        description: "Desired site status"
        required: true
        type: choice
        options:
          - suspended
          - active

permissions:
  contents: write

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Set suspended flag
        id: set
        run: |
          if [ "${{ github.event.inputs.status }}" = "suspended" ]; then
            VALUE=true
          else
            VALUE=false
          fi
          sed -i -E "s/suspended = (true|false);/suspended = ${VALUE};/" site-status.js
          echo "value=${VALUE}" >> "$GITHUB_OUTPUT"
          cat site-status.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- site-status.js; then
            echo "Already ${{ github.event.inputs.status }} — nothing to do."
          else
            git add site-status.js
            git commit -m "Set site status to ${{ github.event.inputs.status }} (manual)"
            git push origin master
          fi

      - name: Summary
        run: |
          echo "### Site status: ${{ github.event.inputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "suspended = ${{ steps.set.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
